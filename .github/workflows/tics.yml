name: TiCS

on: [pull_request, workflow_dispatch]

jobs:
  TiCS:
    name: TiCS
    runs-on: ubuntu-latest
    steps:
    - name: Build Env
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends apt-utils build-essential curl libx11-dev libxext-dev libnsl2
    - name: Checkout
      uses: actions/checkout@v3
    - name: Build project
      run: |
        cd linuxdoom-1.10
        mkdir linux
        make
    - name: TICS Client Analysis
      uses: tiobe/tics-github-action@v2
      with:
        projectName: DOOM
        ticsConfiguration: 'https://testlab.tiobe.com/tiobeweb/releasetest/api/cfg?name=shared-cfg'
        installTics: true
        recalc: 'GATE'
        filelist: .
        ticsAuthToken: ${{secrets.RELEASETESTTOKEN}}
        githubToken: ${{secrets.GITHUB_TOKEN}}
        
